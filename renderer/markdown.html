<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 阅读</title><link rel="stylesheet" href="appearance.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#f4f0f8;color:#332a43;line-height:1.7}header{display:flex;align-items:center;gap:18px;padding:14px 20px;background:#f9f7fc;border-bottom:1px solid #e1d7eb;flex-shrink:0}h1{margin:0;color:#644a7f;font-weight:600}nav{display:flex;gap:5px;margin-left:auto;padding:3px;border:1px solid #e0d5e9;border-radius:10px;background:#f0eaf6}button{cursor:pointer;border:0;border-radius:7px;color:#7c638f;background:transparent;padding:6px 13px;line-height:1.5}button[aria-selected="true"]{color:#fff;background:#8960a8}button:focus-visible{outline:2px solid #a584bd;outline-offset:2px}main{flex:1;min-height:0;margin:16px;border:1px solid #e5dbea;border-radius:13px;background:#fff;overflow:auto;user-select:text}article,main>pre{margin:0;padding:22px 24px;overflow-wrap:anywhere}[hidden]{display:none!important}#markdown-preview{font-size:calc(14px * var(--minto-ui-scale))}#markdown-preview p,#markdown-preview li,#markdown-preview th,#markdown-preview td{font-size:inherit}#markdown-preview h1{font-size:1.7em}#markdown-preview h2{font-size:1.4em}#markdown-preview h3{font-size:1.15em}#markdown-preview h1,#markdown-preview h2,#markdown-preview h3,#markdown-preview h4,#markdown-preview h5,#markdown-preview h6{margin:1.15em 0 .55em;line-height:1.4;color:#644a7f}#markdown-preview>:first-child{margin-top:0}#markdown-preview>:last-child{margin-bottom:0}#markdown-preview p{margin:.7em 0}#markdown-preview ul,#markdown-preview ol{padding-left:1.7em}#markdown-preview blockquote{margin:1em 0;padding:1px 14px;border-left:3px solid #b39ac7;background:#f7f3fb;color:#796289}#markdown-preview pre{overflow:auto;background:#f7f3fb;border:1px solid #e7dded;border-radius:8px;padding:14px;line-height:1.55}#markdown-preview code,#markdown-source{font-family:Consolas,"Cascadia Mono",monospace;font-size:calc(12px * var(--minto-ui-scale))}#markdown-preview :not(pre)>code{padding:2px 5px;border-radius:4px;backgro
