<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minto Assistant</title><link rel="stylesheet" href="appearance.css"><link rel="stylesheet" href="chat.css"></head><body><section id="chat-panel" data-interactive><header id="chat-drag-handle" title="ドラッグで移動">ミント <small>そばにいるのです。</small><button id="chat-zoom-out" title="小さく">−</button><button id="chat-zoom-in" title="大きく">＋</button><button id="chat-close" title="閉じる">×</button></header><div class="relationship-line"><span id="relationship-label"></span><meter id="relationship-meter" min="0" max="100" value="60"></meter></div><p id="chat-empty">想说什么都可以，也可以让ミント一起看看屏幕。</p><div id="chat-history" aria-live="polite"></div><button id="chat-latest" type="button" hidden>查看最新消息</button><div id="agent-activity" hidden aria-label="工具活动"></div><div id="chat-status">話したいこと、聞かせてほしいのです。</div><form id="chat-form"><textarea id="chat-input" rows="1" maxlength="12000" placeholder="ミントに話しかける…" aria-label="聊天输入" aria-describedby="chat-input-hint"></textarea><button id="send-button" class="primary">送信</button><button id="cancel-button" type="button" hidden>中止</button></form><div id="chat-input-hint">Enter 发送 · Shift+Enter 换行</div><div class="tools"><label><input id="observe-checkbox" type="checkbox">画面も見る</label><button id="observe-screen-button" type="button">画面を見る</button><button id="observe-region-button" type="button">鼠标框选</button><button id="settings-button">設定</button><button id="pause-button">観察を休む</button></div></section><div id="chat-resize-handle" title="ドラッグでサイズ変更"></div><script src="../i18n.js"></script><script src="appearance.js"></script><script src="chat.js"></script></body></html>
