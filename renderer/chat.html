<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minto Assistant</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:'Yu Gothic','Microsoft YaHei',sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}[hidden]{display:none!important}#live2d-layer{position:absolute;right:0;top:1%;width:52%;height:98%;pointer-events:none}canvas{display:block;width:100%;height:100%}#chat-panel{position:absolute;left:2%;top:13%;width:46%;height:70%;min-height:300px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.65);border-radius:22px;background:rgba(250,247,255,.84);backdrop-filter:blur(20px);box-shadow:0 12px 35px rgba(61,28,88,.16);color:#342b46;padding:14px}header{display:flex;align-items:center;gap:8px;font-weight:700;color:#684a84}header small{font-weight:400;color:#857a91}header button{margin-left:auto;background:transparent;border:0;color:#78608e;font-size:22px}#chat-history{flex:1;overflow:auto;scrollbar-width:thin;padding:12px 0;display:flex;flex-direction:column;gap:12px;user-select:text}.message{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.7)}.message.user{margin-left:22px;background:rgba(217,204,239,.64)}.message.assistant{margin-right:10px}.message small{display:block;font-size:10px;margin-bottom:4px;color:#887294}#chat-status{min-height:22px;font-size:11px;color:#8a7494;line-height:1.5}#chat-form{display:flex;gap:6px}#chat-input{width:100%;min-width:0;outline:0;background:rgba(255,255,255,.85);border:1px solid #d3c2e5;border-radius:12px;padding:10px;color:#342b46;font-size:12px}#chat-input:focus{border-color:#9470b7}#send-button,#cancel-button{flex-shrink:0;white-space:nowrap;border:0;border-radius:12px;background:#8e69af;color:white;padding:8px 11px;font-size:12px}.tools{display:flex;gap:7px;padding-top:10px;align-items:center;font-size:11px;color:#877191}.tools button{border:1px solid #dfd1ec;background:rgba(255,255,255,.65);border-radius:9px;padding:5px 8px;color:#69507f}.tools label{display:flex;gap:3px;align-items:center}#drag-handle{position:absolute;right:8%;top:3%;border:1px solid rgba(221,205,235,.6);border-radius:12px;padding:7px 10px;background:rgba(253,249,255,.62);color:#816493;font-size:11px;cursor:move;opacity:0;transition:opacity .2s}body:hover #drag-handle,body.chat-open #drag-handle{opacity:1}#mini-controls{position:absolute;right:7%;bottom:1%;display:flex;gap:5px;opacity:0;transition:opacity .2s}body:hover #mini-controls,body.chat-open #mini-controls{opacity:1}#mini-controls button{border:1px solid #d9c9e5;color:#79608c;background:rgba(255,250,255,.7);border-radius:9px;padding:4px 9px;font-size:12px}@media(max-height:500px){#chat-panel{top:4%;height:89%}}

#chat-panel{left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);min-height:0}header{-webkit-app-region:drag;cursor:move;user-select:none}header button{-webkit-app-region:no-drag;margin-left:0}header small{flex:1}#chat-resize-handle{position:absolute;right:10px;bottom:9px;color:#79608c;cursor:nwse-resize;user-select:none;padding:3px}.tools{flex-wrap:wrap}body{touch-action:none}
</style></head><body><section id="chat-panel" data-interactive><header id="chat-drag-handle" title="ドラッグで移動">ミント <small>そばにいるのです。</small><button id="chat-zoom-out" title="小さく">−</button><button id="chat-zoom-in" title="大きく">＋</button><button id="chat-close" title="閉じる">×</button></header><div id="chat-history" aria-live="polite"></div><div id="chat-status">話したいこと、聞かせてほしいのです。</div><form id="chat-form"><input id="chat-input" maxlength="12000" placeholder="ミントに話しかける…" autocomplete="off"><button id="send-button">送信</button><button id="cancel-button" type="button" hidden>中止</button></form><div class="tools"><label><input id="observe-checkbox" type="checkbox">画面も見る</label><button id="observe-screen-button" type="button">画面を見る</button><button id="settings-button">設定</button><button id="pause-button">観察を休む</button></div></section><div id="chat-resize-handle" title="ドラッグでサイズ変更">◢</div><script src="../i18n.js"></script><script src="chat.js"></script></body></html>
